[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "cedar"
version = "0.0.1"
description = "Autonomous Scientific Agent Swarm for Computation-Experiment Discrepancies"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3", "ase>=3.29", "numpy>=2", "anthropic>=1.15,<2", "textual>=8.2,<9", "pypdf>=6",
                "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
cedar = "cedar.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning:ase"]
