[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sim2real"
version = "0.0.1"
description = "Hypothesis-driven agent swarm for simulation-experiment discrepancies (pre-alpha)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.14,<3", "ase>=3.29", "numpy>=2"]

[project.optional-dependencies]
dev = ["pytest>=9.1"]

[project.scripts]
sim2real = "sim2real.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = ["ignore:Setting the shape on a NumPy array:DeprecationWarning:ase"]
